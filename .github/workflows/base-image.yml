# Watches Docker Hub for a newer curator-worker release. The plugins compile against the jars in
# the base image's worker.war, so building against the new tag is the compatibility test: on
# success it opens a PR bumping BASE_IMAGE, on failure an issue with the log. It never pushes an
# image; publishing to the MZK registry stays a manual `make push`.
name: base-image

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  REPOSITORY: ceskaexpedice/curator-worker

jobs:
  bump:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Find the newest release
        id: release
        run: |
          current=$(sed -n "s|^ARG BASE_IMAGE=$REPOSITORY:||p" Dockerfile)
          major=${current%%.*}
          # Releases only: dev builds are tagged <version>-devN
          latest=$(curl -fsS "https://hub.docker.com/v2/repositories/$REPOSITORY/tags?page_size=100&ordering=last_updated" \
            | jq -r '.results[].name' \
            | grep -E "^$major(\.[0-9]+)+$" \
            | sort -V | tail -n 1)
          echo "Pinned $current, newest release $latest"
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)
          if [ -z "$latest" ] || [ "$newest" = "$current" ]; then
            exit 0
          fi
          branch="bump/base-image-$latest"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already exists; its PR covers this release"
            exit 0
          fi
          if [ -n "$(gh issue list --state open --search "\"Base image $latest\" in:title" --json number --jq '.[]')" ]; then
            echo "An open issue already reports $latest"
            exit 0
          fi
          {
            echo "current=$current"
            echo "latest=$latest"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Build and test against it
        id: test
        if: steps.release.outputs.latest
        env:
          LATEST: ${{ steps.release.outputs.latest }}
        run: |
          set -o pipefail
          { make test "BASE_IMAGE=$REPOSITORY:$LATEST" \
            && make build "BASE_IMAGE=$REPOSITORY:$LATEST"; } 2>&1 | tee build.log

      - name: Open a bump PR
        if: steps.release.outputs.latest && steps.test.outcome == 'success'
        env:
          CURRENT: ${{ steps.release.outputs.current }}
          LATEST: ${{ steps.release.outputs.latest }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          sed -i "s|$REPOSITORY:$CURRENT|$REPOSITORY:$LATEST|" Dockerfile Makefile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "build: bump the base image to $REPOSITORY:$LATEST"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "build: bump the base image to $LATEST" \
            --body "$(printf '%s\n\n%s\n\n%s\n' \
              "All plugins build and pass their unit tests against \`$REPOSITORY:$LATEST\`." \
              "Kramerius changes: https://github.com/ceskaexpedice/kramerius/compare/v$CURRENT...v$LATEST" \
              "Unit tests do not cover runtime behaviour: check the diff for code the plugins call, and run a dev-namespace import if it changed. After merging, publish with \`make push\`.")"

      - name: Report the failure
        if: failure() && steps.test.outcome == 'failure'
        env:
          CURRENT: ${{ steps.release.outputs.current }}
          LATEST: ${{ steps.release.outputs.latest }}
        run: |
          {
            echo "The plugins do not build against \`$REPOSITORY:$LATEST\` (pinned: \`$CURRENT\`)."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Kramerius changes: https://github.com/ceskaexpedice/kramerius/compare/v$CURRENT...v$LATEST"
            echo
            echo '```'
            tail -n 80 build.log
            echo '```'
          } > issue.md
          gh issue create --title "Base image $LATEST breaks the build" --body-file issue.md
